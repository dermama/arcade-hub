worker_processes auto;
pid /home/user/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /home/user/nginx_access.log;
    error_log /home/user/nginx_error.log;

    client_body_temp_path /home/user/nginx_client_body;
    proxy_temp_path /home/user/nginx_proxy;
    fastcgi_temp_path /home/user/nginx_fastcgi;
    uwsgi_temp_path /home/user/nginx_uwsgi;
    scgi_temp_path /home/user/nginx_scgi;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server {
        listen 7860;
        server_name localhost;

        # Decoy dashboard
        location / {
            root /home/user/decoy;
            index index.html;
        }

        # Relay API & WebSocket endpoints
        location /session/ {
            proxy_pass http://127.0.0.1:3456/session/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /health {
            proxy_pass http://127.0.0.1:3456/health;
        }
    }
}
